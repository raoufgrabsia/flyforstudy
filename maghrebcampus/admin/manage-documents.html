<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Documents | Maghreb Campus Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --academic-blue: #1e3a8a;
            --academic-gold: #f59e0b;
            --dark-navy: #0f172a;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --sidebar-width: 280px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-dark); }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--dark-navy);
            color: white;
            padding: 2rem;
            overflow-y: auto;
        }
        
        .sidebar-header { margin-bottom: 3rem; }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
        }
        .sidebar-logo i {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f97316, #ec4899);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-section { margin-bottom: 2rem; }
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 1rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: 0.3s ease;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .btn-logout {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .section-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .country-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .country-tab {
            padding: 0.75rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s ease;
        }
        
        .country-tab.active {
            background: var(--academic-blue);
            color: white;
            border-color: var(--academic-blue);
        }
        
        .document-list {
            list-style: none;
        }
        
        .document-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 0.75rem;
        }
        
        .document-item input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-family: inherit;
        }
        
        .btn-remove {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        
        .btn-remove:hover {
            background: #dc2626;
            color: white;
        }
        
        .btn-add {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: #dcfce7;
            color: #166534;
            border: 2px dashed #166534;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1rem;
            transition: 0.3s ease;
        }
        
        .btn-add:hover {
            background: #166534;
            color: white;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .save-notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>Maghreb Campus</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">Main</div>
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">Management</div>
            <a href="manage-prices.html" class="nav-item">
                <i class="fas fa-dollar-sign"></i>
                <span>Prices & Fees</span>
            </a>
            <a href="manage-documents.html" class="nav-item active">
                <i class="fas fa-list-check"></i>
                <span>Document Requirements</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>Manage Document Requirements</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        
        <div class="section-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h2>Edit Required Documents</h2>
                <button class="btn btn-success" onclick="saveDocuments()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
            
            <div class="country-tabs" id="countryTabs">
                <!-- Populated by JS -->
            </div>
            
            <div id="documentsContainer">
                <!-- Populated by JS -->
            </div>
            
            <button class="btn-add" onclick="addDocument()">
                <i class="fas fa-plus"></i> Add New Document
            </button>
        </div>
    </main>
    
    <div class="save-notification" id="saveNotification">
        <i class="fas fa-check-circle"></i> Documents updated successfully!
    </div>

    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }
        
        const countries = [
            { id: 'turkey', name: 'Turkey', type: 'evisa' },
            { id: 'armenia', name: 'Armenia', type: 'evisa' },
            { id: 'georgia', name: 'Georgia', type: 'evisa' },
            { id: 'albania', name: 'Albania', type: 'evisa' },
            { id: 'azerbaijan', name: 'Azerbaijan', type: 'evisa' },
            { id: 'thailand', name: 'Thailand', type: 'evisa' },
            { id: 'indonesia', name: 'Indonesia', type: 'evisa' },
            { id: 'vietnam', name: 'Vietnam', type: 'evisa' },
            { id: 'france', name: 'France', type: 'study' },
            { id: 'hungary', name: 'Hungary', type: 'study' },
            { id: 'poland', name: 'Poland', type: 'study' },
            { id: 'italy', name: 'Italy', type: 'study' },
            { id: 'russia', name: 'Russia', type: 'study' },
            { id: 'china', name: 'China', type: 'study' },
            { id: 'canada', name: 'Canada', type: 'special' }
        ];
        
        let currentCountry = 'turkey';
        let currentDocuments = [];
        
        const defaultDocuments = {
            turkey: [
                'Valid passport (6+ months validity)',
                'Recent passport-sized photo (white background)',
                'Valid credit/debit card for payment',
                'Active email address',
                'Confirmed travel dates',
                'Return flight ticket'
            ],
            armenia: [
                'Valid passport',
                'Passport-sized photo',
                'Passport scan (bio page)',
                'Travel itinerary',
                'Accommodation booking',
                'Payment method',
                'Email address'
            ],
            france: [
                'Campus France authorization (Etudes en France)',
                'Acceptance letter from French institution',
                'Financial guarantee (€615/month minimum)',
                'OFII form (Office Français de l\'Immigration)',
                'Language proficiency proof (TCF/TEF B2 or DELF)',
                'Valid passport (10 years, issued within last 10 years)',
                'Long-stay visa application form',
                'Passport photos (ICAO standards)',
                'Birth certificate (translated + apostilled)',
                'Academic transcripts and diplomas',
                'Motivation letter in French',
                'CV/Resume in French',
                'Proof of accommodation in France',
                'Travel insurance (€30,000 coverage)',
                'Flight reservation'
            ],
            canada: [
                'Valid passport (6+ months validity)',
                'IMM 5257 Application Form',
                'Family Information Form (IMM 5645)',
                '2 Passport photos (35x45mm, white background)',
                '6 months bank statements',
                'Employment letter (if employed)',
                'Business registration (if self-employed)',
                'Property ownership documents',
                'Travel itinerary & flight reservation',
                'Letter of invitation (if visiting family/friends)',
                'Host\'s status in Canada (PR card/citizenship)',
                'Proof of ties to Algeria (employment, family, property)',
                'Previous travel history (passport stamps)',
                'Purpose of travel letter',
                'Marriage/birth certificates (if applicable)',
                'Travel insurance (recommended)'
            ]
        };
        
        function init() {
            renderTabs();
            loadDocuments(currentCountry);
        }
        
        function renderTabs() {
            const tabs = document.getElementById('countryTabs');
            tabs.innerHTML = countries.map(c => `
                <button class="country-tab ${c.id === currentCountry ? 'active' : ''}" onclick="switchCountry('${c.id}')">
                    ${c.name}
                </button>
            `).join('');
        }
        
        function switchCountry(id) {
            currentCountry = id;
            renderTabs();
            loadDocuments(id);
        }
        
        function loadDocuments(countryId) {
            const saved = JSON.parse(localStorage.getItem(`docs_${countryId}`) || 'null');
            currentDocuments = saved || defaultDocuments[countryId] || ['Sample document requirement'];
            renderDocumentList();
        }
        
        function renderDocumentList() {
            const container = document.getElementById('documentsContainer');
            container.innerHTML = `
                <ul class="document-list" id="docList">
                    ${currentDocuments.map((doc, index) => `
                        <li class="document-item">
                            <i class="fas fa-file-alt" style="color: var(--academic-blue);"></i>
                            <input type="text" value="${doc}" id="doc-${index}" onchange="updateDocument(${index}, this.value)">
                            <button class="btn-remove" onclick="removeDocument(${index})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </li>
                    `).join('')}
                </ul>
            `;
        }
        
        function updateDocument(index, value) {
            currentDocuments[index] = value;
        }
        
        function removeDocument(index) {
            currentDocuments.splice(index, 1);
            renderDocumentList();
        }
        
        function addDocument() {
            currentDocuments.push('New document requirement');
            renderDocumentList();
            // Scroll to bottom
            setTimeout(() => {
                const lastInput = document.querySelector(`#doc-${currentDocuments.length - 1}`);
                if (lastInput) lastInput.focus();
            }, 100);
        }
        
        function saveDocuments() {
            // Update from inputs
            const inputs = document.querySelectorAll('.document-item input');
            currentDocuments = Array.from(inputs).map(input => input.value);
            
            // Save to localStorage
            localStorage.setItem(`docs_${currentCountry}`, JSON.stringify(currentDocuments));
            
            // Show notification
            const notif = document.getElementById('saveNotification');
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
        
        init();
    </script>

</body>
</html>
