<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Prices | Maghreb Campus Admin</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --academic-blue: #1e3a8a;
            --academic-gold: #f59e0b;
            --dark-navy: #0f172a;
            --text-dark: #1e293b;
            --text-light: #64748b;
            --bg-light: #f8fafc;
            --sidebar-width: 280px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-dark); }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--dark-navy);
            color: white;
            padding: 2rem;
            overflow-y: auto;
        }
        
        .sidebar-header { margin-bottom: 3rem; }
        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: white;
            font-weight: 800;
            font-size: 1.25rem;
        }
        .sidebar-logo i {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #f97316, #ec4899);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .nav-section { margin-bottom: 2rem; }
        .nav-section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.5);
            margin-bottom: 1rem;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            transition: 0.3s ease;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        
        .btn-logout {
            background: rgba(220, 38, 38, 0.1);
            color: #dc2626;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .section-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .country-section {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .country-section h3 {
            margin-bottom: 1rem;
            color: var(--academic-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: 0.3s ease;
        }
        
        .btn-primary {
            background: var(--academic-blue);
            color: white;
        }
        
        .btn-success {
            background: #10b981;
            color: white;
        }
        
        .save-notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <a href="#" class="sidebar-logo">
                <i class="fas fa-graduation-cap"></i>
                <span>Maghreb Campus</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">Main</div>
            <a href="dashboard.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Dashboard</span>
            </a>
        </div>
        
        <div class="nav-section">
            <div class="nav-section-title">Management</div>
            <a href="manage-prices.html" class="nav-item active">
                <i class="fas fa-dollar-sign"></i>
                <span>Prices & Fees</span>
            </a>
            <a href="manage-documents.html" class="nav-item">
                <i class="fas fa-list-check"></i>
                <span>Document Requirements</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <h1>Manage Prices & Fees</h1>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        
        <div class="section-card">
            <div class="section-header">
                <h2>E-Visa Country Fees</h2>
                <button class="btn btn-success" onclick="savePrices()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
            
            <div id="evisaPrices">
                <!-- Populated by JS -->
            </div>
        </div>
        
        <div class="section-card">
            <div class="section-header">
                <h2>Study Visa Country Fees</h2>
                <button class="btn btn-success" onclick="savePrices()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
            
            <div id="studyPrices">
                <!-- Populated by JS -->
            </div>
        </div>
        
        <div class="section-card">
            <div class="section-header">
                <h2>Additional Services</h2>
                <button class="btn btn-success" onclick="savePrices()">
                    <i class="fas fa-save"></i> Save Changes
                </button>
            </div>
            
            <div id="servicePrices">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>
    
    <div class="save-notification" id="saveNotification">
        <i class="fas fa-check-circle"></i> Changes saved successfully!
    </div>

    <script>
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }
        
        const evisaCountries = [
            { id: 'turkey', name: '🇹🇷 Turkey', govFee: '$61.50' },
            { id: 'armenia', name: '🇦🇲 Armenia', govFee: '$6-31' },
            { id: 'georgia', name: '🇬🇪 Georgia', govFee: '$20.50' },
            { id: 'albania', name: '🇦🇱 Albania', govFee: '$0-50' },
            { id: 'azerbaijan', name: '🇦🇿 Azerbaijan', govFee: '$20-60' },
            { id: 'thailand', name: '🇹🇭 Thailand', govFee: '$40' },
            { id: 'indonesia', name: '🇮🇩 Indonesia', govFee: '$35-150' },
            { id: 'vietnam', name: '🇻🇳 Vietnam', govFee: '$63-123' }
        ];
        
        const studyCountries = [
            { id: 'france', name: '🇫🇷 France', officialFees: '€99 visa + €99 OFII' },
            { id: 'hungary', name: '🇭🇺 Hungary', officialFees: '€60 visa + HUF 18,000' },
            { id: 'poland', name: '🇵🇱 Poland', officialFees: '€80 visa + PLN 340' },
            { id: 'italy', name: '🇮🇹 Italy', officialFees: '€50 visa + €70-160' },
            { id: 'russia', name: '🇷🇺 Russia', officialFees: '$40-160 visa + invitation' },
            { id: 'china', name: '🇨🇳 China', officialFees: '$30-140 visa + medical' }
        ];
        
        const services = [
            { id: 'flight', name: 'Flight Reservation', price: '0' },
            { id: 'hotel', name: 'Hotel Booking', price: '0' },
            { id: 'insurance', name: 'Travel Insurance', price: '0' },
            { id: 'translation', name: 'Document Translation', price: '0' },
            { id: 'appointment', name: 'Appointment Booking', price: '0' },
            { id: 'photo', name: 'Visa Photo Service', price: '0' },
            { id: 'review', name: 'Document Review', price: '0' },
            { id: 'priority', name: 'Priority Processing', price: '0' }
        ];
        
        function renderEvisaPrices() {
            const container = document.getElementById('evisaPrices');
            const saved = JSON.parse(localStorage.getItem('evisaPrices') || '{}');
            
            container.innerHTML = evisaCountries.map(country => `
                <div class="country-section">
                    <h3>${country.name}</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Our Service Fee (DZD)</label>
                            <input type="number" id="evisa-${country.id}-service" value="${saved[country.id]?.serviceFee || '0'}" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Government Fee</label>
                            <input type="text" id="evisa-${country.id}-gov" value="${saved[country.id]?.govFee || country.govFee}" placeholder="$0">
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderStudyPrices() {
            const container = document.getElementById('studyPrices');
            const saved = JSON.parse(localStorage.getItem('studyPrices') || '{}');
            
            container.innerHTML = studyCountries.map(country => `
                <div class="country-section">
                    <h3>${country.name}</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Our Service Fee (DZD)</label>
                            <input type="number" id="study-${country.id}-service" value="${saved[country.id]?.serviceFee || '0'}" placeholder="0">
                        </div>
                        <div class="form-group">
                            <label>Official Fees</label>
                            <input type="text" id="study-${country.id}-official" value="${saved[country.id]?.officialFees || country.officialFees}" placeholder="€0">
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function renderServicePrices() {
            const container = document.getElementById('servicePrices');
            const saved = JSON.parse(localStorage.getItem('servicePrices') || '{}');
            
            container.innerHTML = services.map(service => `
                <div class="country-section">
                    <h3><i class="fas fa-concierge-bell"></i> ${service.name}</h3>
                    <div class="form-group">
                        <label>Price (DZD)</label>
                        <input type="number" id="service-${service.id}" value="${saved[service.id] || service.price}" placeholder="0">
                    </div>
                </div>
            `).join('');
        }
        
        function savePrices() {
            // Save E-Visa prices
            const evisaData = {};
            evisaCountries.forEach(country => {
                evisaData[country.id] = {
                    serviceFee: document.getElementById(`evisa-${country.id}-service`).value,
                    govFee: document.getElementById(`evisa-${country.id}-gov`).value
                };
            });
            localStorage.setItem('evisaPrices', JSON.stringify(evisaData));
            
            // Save Study prices
            const studyData = {};
            studyCountries.forEach(country => {
                studyData[country.id] = {
                    serviceFee: document.getElementById(`study-${country.id}-service`).value,
                    officialFees: document.getElementById(`study-${country.id}-official`).value
                };
            });
            localStorage.setItem('studyPrices', JSON.stringify(studyData));
            
            // Save Service prices
            const serviceData = {};
            services.forEach(service => {
                serviceData[service.id] = document.getElementById(`service-${service.id}`).value;
            });
            localStorage.setItem('servicePrices', JSON.stringify(serviceData));
            
            // Show notification
            const notif = document.getElementById('saveNotification');
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 3000);
        }
        
        renderEvisaPrices();
        renderStudyPrices();
        renderServicePrices();
    </script>

</body>
</html>
