<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Mouhja ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .star {
            position: fixed;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px rgba(255,255,255,0.8); }
        }

        .shooting-star {
            position: fixed;
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, white, transparent);
            animation: shoot 4s infinite linear;
            opacity: 0;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes shoot {
            0% {
                transform: translateX(-100px) translateY(0) rotate(-45deg);
                opacity: 1;
            }
            100% {
                transform: translateX(500px) translateY(500px) rotate(-45deg);
                opacity: 0;
            }
        }

        .moon {
            position: fixed;
            top: 50px;
            right: 50px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #fffacd, #f0e68c);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(240, 230, 140, 0.4), 0 0 120px rgba(240, 230, 140, 0.2);
            pointer-events: none;
            z-index: 0;
        }

        .moon::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: rgba(200, 190, 100, 0.3);
            border-radius: 50%;
        }

        .moon::before {
            content: '';
            position: absolute;
            top: 35px;
            left: 45px;
            width: 8px;
            height: 8px;
            background: rgba(200, 190, 100, 0.2);
            border-radius: 50%;
        }

        .container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.2), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .moon-icon {
            font-size: 60px;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 20px rgba(240, 230, 140, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name {
            font-family: 'Dancing Script', cursive;
            font-size: 5rem;
            color: #e6e6fa;
            margin: 10px 0 15px 0;
            text-shadow: 0 0 20px rgba(230, 230, 250, 0.5), 0 0 40px rgba(147, 112, 219, 0.3);
            animation: glow 2.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(230, 230, 250, 0.5), 0 0 40px rgba(147, 112, 219, 0.3); }
            to { text-shadow: 0 0 30px rgba(230, 230, 250, 0.8), 0 0 60px rgba(147, 112, 219, 0.5), 0 0 90px rgba(138, 43, 226, 0.3); }
        }

        .message {
            font-size: 1.2rem;
            color: #d8bfd8;
            margin: 15px 0;
            line-height: 1.8;
            font-weight: 300;
        }

        .question-box {
            margin-top: 25px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .question {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: #dda0dd;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 45px;
            font-size: 1.1rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            text-decoration: none;
            display: inline-block;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
            box-shadow: 0 4px 20px rgba(196, 69, 105, 0.4);
        }

        .btn-yes:active {
            transform: scale(0.95);
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.1);
            color: #b0c4de;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .btn-no:active {
            transform: scale(0.95);
        }

        .surprise {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.95);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .surprise-content {
            text-align: center;
            animation: popIn 0.6s ease 0.3s both;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .surprise-emoji {
            font-size: 80px;
            margin-bottom: 15px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .surprise-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ff6b9d;
            text-shadow: 0 0 30px rgba(255, 107, 157, 0.5);
        }

        .surprise-sub {
            font-size: 1.1rem;
            color: #d8bfd8;
            margin-top: 12px;
            line-height: 1.6;
        }

        .whatsapp-btn {
            margin-top: 25px;
            padding: 14px 40px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
        }

        .whatsapp-btn:active {
            transform: scale(0.95);
        }

        .close-surprise {
            margin-top: 20px;
            padding: 10px 30px;
            background: transparent;
            color: #dda0dd;
            border: 2px solid #dda0dd;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-surprise:active {
            background: #dda0dd;
            color: #0f0c29;
        }

        .footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #b0c4de;
            opacity: 0.6;
        }

        @media (max-width: 600px) {
            .name { font-size: 3.5rem; }
            .card { padding: 35px 20px; }
            .message { font-size: 1rem; }
            .question { font-size: 1.5rem; }
            .btn { padding: 12px 35px; font-size: 1rem; }
            .surprise-text { font-size: 2.2rem; }
            .surprise-emoji { font-size: 60px; }
            .surprise-sub { font-size: 1rem; }
            .moon { width: 50px; height: 50px; top: 20px; right: 20px; }
            .whatsapp-btn { font-size: 1rem; padding: 12px 30px; }
        }
    </style>
</head>
<body>

    <!-- Stars -->
    <div class="star" style="top: 10%; left: 10%; width: 3px; height: 3px; animation-delay: 0s;"></div>
    <div class="star" style="top: 20%; left: 25%; width: 2px; height: 2px; animation-delay: 0.5s;"></div>
    <div class="star" style="top: 15%; left: 40%; width: 4px; height: 4px; animation-delay: 1s;"></div>
    <div class="star" style="top: 30%; left: 60%; width: 2px; height: 2px; animation-delay: 1.5s;"></div>
    <div class="star" style="top: 10%; left: 75%; width: 3px; height: 3px; animation-delay: 0.3s;"></div>
    <div class="star" style="top: 25%; left: 85%; width: 2px; height: 2px; animation-delay: 0.8s;"></div>
    <div class="star" style="top: 40%; left: 15%; width: 2px; height: 2px; animation-delay: 1.2s;"></div>
    <div class="star" style="top: 50%; left: 35%; width: 3px; height: 3px; animation-delay: 0.2s;"></div>
    <div class="star" style="top: 45%; left: 55%; width: 2px; height: 2px; animation-delay: 1.7s;"></div>
    <div class="star" style="top: 55%; left: 80%; width: 3px; height: 3px; animation-delay: 0.6s;"></div>
    <div class="star" style="top: 70%; left: 20%; width: 2px; height: 2px; animation-delay: 1.1s;"></div>
    <div class="star" style="top: 65%; left: 45%; width: 4px; height: 4px; animation-delay: 0.4s;"></div>
    <div class="star" style="top: 75%; left: 70%; width: 2px; height: 2px; animation-delay: 1.4s;"></div>
    <div class="star" style="top: 85%; left: 30%; width: 3px; height: 3px; animation-delay: 0.9s;"></div>
    <div class="star" style="top: 80%; left: 90%; width: 2px; height: 2px; animation-delay: 1.6s;"></div>
    <div class="star" style="top: 5%; left: 50%; width: 3px; height: 3px; animation-delay: 0.7s;"></div>
    <div class="star" style="top: 35%; left: 5%; width: 2px; height: 2px; animation-delay: 1.3s;"></div>
    <div class="star" style="top: 60%; left: 95%; width: 3px; height: 3px; animation-delay: 0.1s;"></div>

    <!-- Shooting stars -->
    <div class="shooting-star" style="top: 15%; left: 10%; animation-delay: 3s;"></div>
    <div class="shooting-star" style="top: 40%; left: 60%; animation-delay: 7s;"></div>
    <div class="shooting-star" style="top: 25%; left: 80%; animation-delay: 11s;"></div>

    <!-- Moon -->
    <div class="moon"></div>

    <div class="container">
        <div class="card">
            <div class="moon-icon">🌙</div>
            
            <div class="name">Mouhja</div>
            
            <div class="message">
                Under this endless starry sky,<br>
                there's only one name I whisper.<br>
                You are my moon, my stars,<br>
                my entire universe.
            </div>

            <div class="question-box">
                <div class="question">Do you love me?</div>
                <div class="buttons">
                    <button class="btn btn-yes" onclick="showLove()">Yes</button>
                    <button class="btn btn-no" onclick="showTease()">No</button>
                </div>
            </div>
            
            <div class="footer">Forever & Always</div>
        </div>
    </div>

    <!-- Yes Surprise + WhatsApp -->
    <div class="surprise" id="surpriseYes">
        <div class="surprise-content">
            <div class="surprise-emoji">🥰</div>
            <div class="surprise-text">I knew it!</div>
            <div class="surprise-sub">Send me your answer on WhatsApp 💚</div>
            <a class="whatsapp-btn" id="whatsappLink" href="#">
                📱 Send "I love you too"
            </a>
            <button class="close-surprise" onclick="hideLove()">Close</button>
        </div>
    </div>

    <!-- No Tease -->
    <div class="surprise" id="surpriseNo">
        <div class="surprise-content">
            <div class="surprise-emoji">😏</div>
            <div class="surprise-text">Are you sure?</div>
            <div class="surprise-sub">My heart says you do...<br>Try "Yes" and see what happens 💕</div>
            <button class="close-surprise" onclick="hideTease()">Okay, let me think...</button>
        </div>
    </div>

    <script>
        const YOUR_PHONE_NUMBER = "213542920545";

        function showLove() {
            document.getElementById('surpriseYes').style.display = 'flex';
            
            const message = encodeURIComponent("I love you too 💕");
            const waLink = `https://wa.me/${YOUR_PHONE_NUMBER}?text=${message}`;
            document.getElementById('whatsappLink').href = waLink;
            
            createHearts();
        }

        function hideLove() {
            document.getElementById('surpriseYes').style.display = 'none';
        }

        function showTease() {
            document.getElementById('surpriseNo').style.display = 'flex';
        }

        function hideTease() {
            document.getElementById('surpriseNo').style.display = 'none';
        }

        function createHearts() {
            const surprise = document.getElementById('surpriseYes');
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = ['💖', '💕', '💗', '💝', '💘'][Math.floor(Math.random() * 5)];
                    heart.style.position = 'fixed';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '100%';
                    heart.style.fontSize = (20 + Math.random() * 20) + 'px';
                    heart.style.pointerEvents = 'none';
                    heart.style.animation = 'floatUp 3s ease-out forwards';
                    heart.style.zIndex = '101';
                    surprise.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
            }
        }
    </script>

    <style>
        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>

</body>
</html>
